# railway-drift — does Railway still match .railway/railway.ts? (ADR-0088)
#
# Read-only: `railway config plan --detailed-exit-code` exits 0 when Railway
# matches the file, 2 when they differ (a dashboard edit, or a committed change
# not applied yet), 1 on error. It never applies anything: applying stays a
# person's step (`railway config apply`, which asks for confirmation).
#
# Needs a repository secret RAILWAY_TOKEN: a Railway PROJECT token for project
# `operai`, environment `production`. Without it the job says so and passes.
name: railway-drift

on:
  schedule:
    - cron: "17 6 * * 1-5" # weekdays, 06:17 UTC
  push:
    branches: [main]
    paths:
      - ".railway/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plan:
    name: plan (production)
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Token present?
        id: token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN is not set — drift check skipped (see infra/README.md § Railway configuration as code)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
      - name: Install the IaC SDK (root package.json) and the Railway CLI
        if: steps.token.outputs.present == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm install --global @railway/cli@5.71.0
      - name: railway config plan
        if: steps.token.outputs.present == 'true'
        run: |
          set +e
          railway config plan --detailed-exit-code
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::Railway differs from .railway/railway.ts — read the plan above; fix the file or run 'railway config apply'"
          fi
          exit "$rc"
