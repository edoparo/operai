[install]
exact = true
production = false

[run]
# No "$ <command>" echo: bun prints it on stderr, which Railway logs as an error (preDeploy migrations).
silent = true
bun = true

[test]
timeout = 10000
# Sets the test environment, and points DATABASE_URL at the `*_test` database, BEFORE any
# module reads env: the suite TRUNCATEs tables, so it must never see the dev database.
preload = ["./src/test-support/env.ts"]
