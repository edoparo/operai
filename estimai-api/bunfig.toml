[install]
exact = true
production = false

[run]
# No "$ <command>" echo: bun prints it on stderr, which Railway logs as an error (preDeploy migrations).
silent = true
bun = true

[test]
timeout = 10000
# Captures DATABASE_URL before any test file can replace it (src/lib/testDatabaseUrl.ts).
preload = ["./src/lib/testDatabaseUrl.ts"]
